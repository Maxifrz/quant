[project]
name = "qt"
version = "0.1.0"
description = "Krypto-Quant-System mit LLM als Allokator und Strategie-Forscher"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "ccxt>=4.2",
    "pydantic>=2.6",
    "typer>=0.12",
    "matplotlib>=3.8",
    "anthropic>=0.40",
    # Das SDK fuer `--provider nim`. Bis ADR-079 ein Extra, weil Anthropic der
    # Default ist -- und genau deshalb in jedem frischen Container tot: das
    # Extra installiert niemand, `uv run` synchronisiert nur Kernabhaengigkeiten.
    # In einer Umgebung ohne Anthropic-Schluessel ist NIM aber der *einzige*
    # Anbieter, der ueberhaupt antwortet. Eine Option, die dort fehlt, wo sie
    # gebraucht wird, ist keine Option.
    "openai>=1.40",
    "scipy>=1.11",
    "arch>=6.3",
    "hmmlearn>=0.3",
]

[project.scripts]
qt = "qt.cli:app"

[project.optional-dependencies]
# `ruff` gehoert hier hin und nicht auf den Rechner: bis 2026-09-08 war es
# global installiert, `uv run ruff` fiel auf den PATH durch, und in der
# GitHub-Action gab es keinen -- "Failed to spawn: ruff". Ein Linter, dessen
# Version davon abhaengt, wer ihn startet, ist derselbe Kategorienfehler wie
# ein Test, der die Umgebung prueft (ADR-074).
#
# **Die Obergrenze ist Absicht.** Das Projekt hat keine `[tool.ruff]`-Sektion,
# ruff laeuft also auf seinen Standardregeln -- und die aendern sich zwischen
# Nebenversionen. Gemessen: mit 0.16.6 meldet derselbe unveraenderte Code
# **183** Befunde. Das waere kein Fund am Code, sondern ein neuer Massstab,
# und einen Massstab zu wechseln ist eine eigene Entscheidung mit eigenem
# Diff -- dieselbe Regel wie fuer die Gate-Schwellen (ADR-057). Wer 0.16
# will, hebt die Grenze und raeumt die 183 auf, in einem Commit, den man
# lesen kann.
dev = ["pytest>=8.0", "ruff>=0.15,<0.16"]
# Fuer qt.strategy.library.timesfm_strategy.TimesFMForecaster. Schwergewichtig
# (zieht torch nach, mehrere GB inkl. Checkpoint) und deshalb keine
# Standardabhaengigkeit -- ohne dieses Extra ist die Strategie ueber
# NaiveForecaster trotzdem voll test- und lauffaehig. Siehe ADR-022.
timesfm = ["timesfm[torch]>=2.0"]
# Seit ADR-079 leer bis auf die Kernabhaengigkeit: `openai` gehoert jetzt zu
# den Pflichtpaketen. Das Extra bleibt stehen, damit `uv sync --extra nim` aus
# alten Anleitungen nicht mit "unknown extra" abbricht.
nim = ["openai>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: Test mit spuerbarer Laufzeit (Simulationen in Produktionsgroesse).",
]
